[env:kc868-a6-base]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit PN532
    adafruit/RTClib
    adafruit/Adafruit BME680 Library
    adafruit/DHT sensor library
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    mikalhart/TinyGPSPlus
    sandeepmistry/LoRa
    bblanchon/ArduinoJson@^6.21.5
    h2zero/NimBLE-Arduino@^2.5.2

[platformio]
default_envs = kc868-a6

[env:kc868-a6]
extends = env:kc868-a6-base

[env:kc868-a6-lora]
extends = env:kc868-a6
build_flags = ${env:kc868-a6.build_flags} -DUSE_RADIO_LORA

[env:kc868-a6-nrf24]
extends = env:kc868-a6
build_flags = ${env:kc868-a6.build_flags} -DUSE_RADIO_NRF24
lib_deps =
    ${env:kc868-a6-base.lib_deps}
    nrf24/RF24

[env:kc868-a6-gps]
extends = env:kc868-a6
build_flags = ${env:kc868-a6.build_flags} -DUSE_GPS

[env:kc868-a6-coprocessor]
extends = env:kc868-a6
build_flags = ${env:kc868-a6.build_flags} -DUSE_ZIGBEE_THREAD_COPROCESSOR