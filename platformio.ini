[env:kc868-a6-base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DKINCONDUCTOR_VERSION=\"1.1.2\"
build_unflags =
    -std=gnu++11
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit PN532@1.3.4
    adafruit/RTClib@2.1.4
    adafruit/Adafruit BME680 Library@2.0.6
    adafruit/DHT sensor library@1.4.7
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    mikalhart/TinyGPSPlus@1.1.0
    sandeepmistry/LoRa@0.8.0
    bblanchon/ArduinoJson@6.21.6
    h2zero/NimBLE-Arduino@2.5.2
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15

[platformio]
default_envs = kc868-a6-coprocessor

[env:kc868-a6]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A6\"

[env:kc868-a4]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A4\"

[env:kc868-a8]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A8\"

[env:kc868-a8s]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A8S\"

[env:kc868-a16]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A16\"

[env:kc868-a32]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A32\"

[env:kc868-a64]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A64\"

[env:kc868-a128]
extends = env:kc868-a6-base
build_flags =
    ${env:kc868-a6-base.build_flags}
    -DKC868_TARGET_MODEL=\"KC868-A128\"

[env:kc868-a6-coprocessor]
extends = env:kc868-a6
build_flags =
    ${env:kc868-a6.build_flags}
    -DUSE_ZIGBEE_THREAD_COPROCESSOR
    -DKC868_BOARD_PROFILE_COPROCESSOR
    -DKC868_BOARD_PN532_SPI