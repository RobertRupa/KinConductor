name: Validate and release firmware
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [kc868-a6, kc868-a6-coprocessor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build application
        env:
          PROFILE: ${{ matrix.profile }}
        run: pio run -e "$PROFILE"
      - name: Run native and JavaScript tests
        env:
          PIO_ENV: ${{ matrix.profile }}
        run: npm test
      - name: Build matching LittleFS
        env:
          PROFILE: ${{ matrix.profile }}
        run: pio run -e "$PROFILE" -t buildfs
      - name: Validate and package release
        env:
          PROFILE: ${{ matrix.profile }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            node scripts/package-release.js "$PROFILE" "$TAG"
          else
            node scripts/package-release.js "$PROFILE"
          fi
          VERSION="$(node -p 'require("./package.json").version')"
          tar -czf "dist/KinConductor-v${VERSION}-${PROFILE}.tar.gz" -C "dist/releases/v${VERSION}" "$PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.profile }}
          path: dist/KinConductor-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish successful tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/*.tar.gz --verify-tag --title "KinConductor $TAG" --notes "Base A6 and coprocessor profiles without RF24. Each archive contains matching application, factory image, LittleFS, boot components, manifest and SHA256 checksums. Factory images do not include LittleFS and are not routine NVS-preserving updates. See the repository documentation and packaged README before flashing."
