name: Validate and release firmware
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [kc868-a6-base, kc868-a6, kc868-a4, kc868-a8, kc868-a8s, kc868-a16, kc868-a32, kc868-a64, kc868-a128, kc868-a6-coprocessor]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify tag matches firmware version
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            node -e 'const version = require("./package.json").version; if (process.env.TAG !== `v${version}`) throw new Error("Tag does not match package version");'
            git rev-parse --verify "refs/tags/$TAG^{commit}"
          fi
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build application
        env:
          PROFILE: ${{ matrix.profile }}
        run: pio run -e "$PROFILE"
      - name: Run native and JavaScript tests
        env:
          PIO_ENV: ${{ matrix.profile }}
        run: npm test
      - name: Build matching LittleFS
        env:
          PROFILE: ${{ matrix.profile }}
        run: pio run -e "$PROFILE" -t buildfs
      - name: Validate and package release
        env:
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/package-release.js "$PROFILE" "$TAG"
          VERSION="$(node -p 'require("./package.json").version')"
          tar -czf "dist/KinConductor-v${VERSION}-${PROFILE}.tar.gz" -C "dist/releases/v${VERSION}" "$PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.profile }}
          path: dist/KinConductor-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag
              });
              core.info(`Updating release ${data.id}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `KinConductor ${tag}`,
                draft: true,
                body: "All ten configured PlatformIO profiles are built and packaged; all images omit RF24. KC868-Ax aliases other than A6 reuse the A6 baseline pin map and are not electrically validated for those boards. The shared kc868-a6-base profile is a generic build configuration. Each archive contains matching application, factory image, LittleFS, boot components, manifest and SHA256 checksums. Factory images do not include LittleFS and are not routine NVS-preserving updates. See the repository documentation and packaged README before flashing."
              });
            }
      - name: Publish successful tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" release-assets/*.tar.gz --clobber
          gh release edit "$TAG" --draft=false
